name: Android release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run lint and unit tests
        run: ./gradlew lintDebug testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/openwhoop-debug-${{ github.sha }}.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwhoop-debug-apk
          path: release/*.apk

      - name: Publish latest debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-${{ github.run_number }}
          name: Android debug build ${{ github.run_number }}
          body: |
            Latest debug APK built from `${{ github.ref_name }}` at `${{ github.sha }}`.

            This release was created automatically from a push to `main`.
          files: release/*.apk
          make_latest: true
